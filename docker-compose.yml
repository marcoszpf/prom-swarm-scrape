services:
  scrape:
    image: prom-swarm-scrape:latest
    ports:
      - target: 8080
        published: 8888
        protocol: tcp
        mode: host
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
